services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - db-data:/app/data/
      - ./backend/data:/app/data
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - task-manager-net
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import requests; response = requests.get('${BACKEND_API_MAIN_URL}/health', timeout=3); response.raise_for_status();"
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    volumes:
      - frontend_node_modules:/app/node_modules
      - ./frontend/src/:/app/src/
    networks:
      - task-manager-net
    depends_on:
      backend :
        condition: service_healthy


volumes:
  db-data:
  frontend_node_modules:

networks:
  task-manager-net:
